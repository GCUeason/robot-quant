name: Daily prediction and simulation

on:
  workflow_dispatch:
  schedule:
    # GitHub cron 使用 UTC；08:30 UTC 对应北京时间 16:30。
    - cron: "30 8 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-robot-quant
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install ".[dev]"

      - name: Validate
        run: |
          python -m ruff check .
          python -m pytest

      - name: Update prediction and simulation
        run: robot-quant run-daily

      - name: Commit changed results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/
          if git diff --cached --quiet; then
            echo "No market-data changes."
            exit 0
          fi
          git commit -m "chore: update daily simulation"
          git push
